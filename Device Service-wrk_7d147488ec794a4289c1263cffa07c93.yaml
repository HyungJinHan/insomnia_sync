      sortKey: -1783064246011
      description: >-
        # Insomnia OAuth 2.0 설정 가이드


        이 문서는 Insomnia에서 OAuth 2.0 인증을 설정하고, 폴더 수준에서의 토큰 상속 및 관련 이슈를 다루는 방법을 안내함


        ---


        ## 1. 폴더 수준 인증과 하위 요청 상속


        동일한 인증이 필요한 여러 요청을 관리하기 위해 폴더 수준에서 OAuth 2.0을 설정 가능


        1.  **부모 폴더**의 `OAuth` 탭에서 위의 "OAuth 2.0 기본 설정" 단계를 수행하여 OAuth 2.0 인증을
        구성

        2.  **하위 요청**의 `OAuth` 탭에서 인증 방식을 **`Inherit from parent`**로 선택


        이렇게 하면 하위 요청은 부모 폴더의 OAuth 2.0 설정과 발급된 토큰을 상속받아 사용


        부모 폴더로 이동하여 인증을 거치지 않고 `Inherit from parent` 처리된 하위 요청 파일은 자동으로 로그인 페이지
        팝업


        ---


        ## 2. 알려진 이슈 및 해결 방법


        ### 2.1. SSE(Server-Sent Events)에서의 인증 문제


        Insomnia는 SSE 프로토콜을 지원하지만, `Inherit from parent` 방식으로 상속받은 OAuth 2.0 토큰이
        SSE 연결에서는 정상적으로 적용되지 않음


        #### 2.1.1. 해결 방안


        - 요청에 직접 OAuth 2.0 설정 (우회 방법)
        	`Inherit from parent` 대신, **해당 요청 자체에 OAuth 2.0 인증을 직접 설정**하며, 해당 요청이 토큰을 직접 소유하게 되어 인증 헤더 생성이 보장

        	- 하위 요청의 `Auth` 탭에서 `OAuth 2.0`을 직접 선택합니다.
        	- 부모 폴더와 동일한 OAuth 2.0 설정값을 입력하고 `Fetch Tokens`를 실행합니다.

        ### 2.2. 인증이 완료된 상태에서의 권한 에러


        OAuth 부모 폴더에서의 인증 완료 후에도 데이터를 불러올때 인증 에러가 발생하는 경우


        #### 2.2.1. 해결 방안


        - 토큰 만료로 인한 인증 에러의 경우 `Refresh Token`를 통해 토큰 갱신

        - 토큰 발급 중복으로 인한 토큰 꼬임으로 인증 불가의 경우, `Clear OAuth 2 session` 버튼과 `Clear`로
        현재 세션의 토큰을 삭제, 재인증 진행
